<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Egg Tycoon - Town View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400,FILL@0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .isometric-grid {
            background-image: 
                linear-gradient(30deg, #e5e7eb 12%, transparent 12.5%, transparent 87%, #e5e7eb 87.5%, #e5e7eb),
                linear-gradient(150deg, #e5e7eb 12%, transparent 12.5%, transparent 87%, #e5e7eb 87.5%, #e5e7eb),
                linear-gradient(30deg, #e5e7eb 12%, transparent 12.5%, transparent 87%, #e5e7eb 87.5%, #e5e7eb),

                linear-gradient(60deg, #d1d5db 25%, transparent 25.5%, transparent 75%, #d1d5db 75%, #d1d5db),
                linear-gradient(60deg, #d1d5db 25%, transparent 25.5%, transparent 75%, #d1d5db 75%, #d1d5db);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">

</div>
</div>

<p class="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-wider">EGGS</p>
</div>
<div class="flex items-baseline gap-2">

</div>
<div class="flex min-w-[140px] flex-1 flex-col gap-1 rounded-xl p-4 bg-white dark:bg-slate-800 shadow-sm border border-primary/5">

<div class="h-12 bg-blue-100 dark:bg-blue-800/50 rounded-lg"></div>

<div class="h-12 bg-blue-100 dark:bg-blue-800/50 rounded-lg"></div>

</div>
</div>

<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1">egg</span>

<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1">egg</span>

</div>

</div>

<div class="shrink-0 flex items-center gap-2">

<p class="text-primary text-xs font-black">65</p>

</div>

</div>

</div>
<p class="text-[10px] font-bold leading-normal tracking-wider uppercase">TOWN</p>

<span class="material-symbols-outlined text-[28px]">local_shipping</span>

<p class="text-[10px] font-bold leading-normal tracking-wider uppercase">TRUCKS</p>
