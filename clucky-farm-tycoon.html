<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clucky Farm Tycoon 🐔</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ec5b13",
            "background-light": "#f8f6f6",
            "background-dark": "#221610",
          },
          fontFamily: {
            "display": ["Public Sans"]
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }

    .zone-container {
      display: none;
      height: 100%;
      overflow-y: auto;
    }

    .zone-container.active {
      display: block;
    }

    /* Progress Bar Animations */
    .progress-fill {
      transition: width 0.3s ease-out;
    }

    /* Modals */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      z-index: 5000;
      display: flex;
      align-items: flex-end;
    }

    .modal-box {
      width: 100%;
      max-height: 88vh;
      background: #f8f6f6;
      border-radius: 22px 22px 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp .25s cubic-bezier(.34, 1.45, .64, 1);
    }

    .dark .modal-box {
      background: #221610;
      border-top: 1px solid #334155;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%)
      }

      to {
        transform: translateY(0)
      }
    }

    .modal-head {
      display: flex;
      align-items: center;
      padding: 14px 16px 10px;
      flex-shrink: 0;
      position: relative;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .dark .modal-head {
      border-bottom-color: rgba(255, 255, 255, 0.1);
    }

    .modal-drag {
      width: 36px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 2px;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .dark .modal-drag {
      background: #475569;
    }

    .modal-title {
      font-family: 'Public Sans', sans-serif;
      font-size: 1.1em;
      font-weight: 700;
      color: #ec5b13;
      flex: 1;
      text-align: center;
      margin-top: 4px;
    }

    .modal-close {
      background: transparent;
      border: none;
      width: 32px;
      height: 32px;
      color: #64748b;
      font-size: 1.2em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      overflow-y: auto;
      flex: 1;
      padding-bottom: 20px;
    }

    /* Toasts */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(34, 22, 16, 0.95);
      color: #f8f6f6;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.82em;
      font-weight: 600;
      z-index: 8000;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      border: 1.5px solid #ec5b13;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Floaters */
    .floater {
      position: fixed;
      z-index: 9999;
      font-weight: 700;
      font-family: 'Public Sans', sans-serif;
      pointer-events: none;
      animation: floatUp 1.1s ease-out forwards;
      font-size: 1em;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      60% {
        opacity: 1;
        transform: translateY(-50px) scale(1.1);
      }

      100% {
        opacity: 0;
        transform: translateY(-80px) scale(0.8);
      }
    }

    /* Isometric grid for town */
    .isometric-grid {
      background-image:
        linear-gradient(30deg, #e5e7eb 12%, transparent 12.5%, transparent 87%, #e5e7eb 87.5%, #e5e7eb),
        linear-gradient(150deg, #e5e7eb 12%, transparent 12.5%, transparent 87%, #e5e7eb 87.5%, #e5e7eb),
        linear-gradient(30deg, #e5e7eb 12%, transparent 12.5%, transparent 87%, #e5e7eb 87.5%, #e5e7eb),
        linear-gradient(150deg, #e5e7eb 12%, transparent 12.5%, transparent 87%, #e5e7eb 87.5%, #e5e7eb),
        linear-gradient(60deg, #d1d5db 25%, transparent 25.5%, transparent 75%, #d1d5db 75%, #d1d5db),
        linear-gradient(60deg, #d1d5db 25%, transparent 25.5%, transparent 75%, #d1d5db 75%, #d1d5db);
      background-size: 80px 140px;
      background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
    }

    .dark .isometric-grid {
      background-image:
        linear-gradient(30deg, #1e293b 12%, transparent 12.5%, transparent 87%, #1e293b 87.5%, #1e293b),
        linear-gradient(150deg, #1e293b 12%, transparent 12.5%, transparent 87%, #1e293b 87.5%, #1e293b),
        linear-gradient(30deg, #1e293b 12%, transparent 12.5%, transparent 87%, #1e293b 87.5%, #1e293b),
        linear-gradient(150deg, #1e293b 12%, transparent 12.5%, transparent 87%, #1e293b 87.5%, #1e293b),
        linear-gradient(60deg, #0f172a 25%, transparent 25.5%, transparent 75%, #0f172a 75%, #0f172a),
        linear-gradient(60deg, #0f172a 25%, transparent 25.5%, transparent 75%, #0f172a 75%, #0f172a);
    }
  </style>
</head>

<body

  <div id="app"

      <!-- Level Progress Bar pointer-events-auto -->

    </div>

    <!-- Main View Area Content container -->
    <div id="mainArea" class="flex-1 overflow-hidden relative pb-[80px]">

      <!-- FARM ZONE -->

      </div>

      <!-- MARKET (TOWN) ZONE -->

      </div>

      <!-- FACTORY / RECIPES ZONE -->

      </div>

      <!-- UPGRADES & HIRING ZONE -->

            onclick="switchUpgradeTab('upgrades')" id="btn-tab-upgrades">Upgrades</button>

        </div>
        <div id="upgradesRenderContainer" class="h-full w-full pb-20"></div>
      </div>

      <!-- TRUCKS (FLEET) ZONE -->
      <div class="zone-container bg-background-light dark:bg-background-dark pt-[88px]" id="zone-trucks">
        <div id="trucksRenderContainer" class="h-full w-full pb-20"></div>
      </div>

      <!-- FINANCE ZONE -->
      <div class="zone-container bg-background-light dark:bg-background-dark pt-[88px]" id="zone-finance">
        <div id="financeRenderContainer" class="h-full w-full px-4 pb-20"></div>
      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div
      class="fixed bottom-0 left-0 right-0 w-full max-w-md mx-auto z-40 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-2 pb-6 pt-3 shadow-[0_-4px_20px_rgba(0,0,0,0.1)]">
      <div class="flex items-center justify-between">
        <a class="flex flex-1 flex-col items-center gap-1 group cursor-pointer" onclick="switchTab('farm')"
          id="nav-farm">
          <div
            class="nav-icon-container relative flex items-center justify-center size-10 rounded-xl bg-primary text-white transition-all group-active:scale-95">
            <span class="material-symbols-outlined text-xl">agriculture</span>
          </div>
          <p class="nav-text text-[10px] font-extrabold text-primary uppercase tracking-wider">Farm</p>
        </a>

        <a class="flex flex-1 flex-col items-center gap-1 group cursor-pointer" onclick="switchTab('market')"
          id="nav-market">
          <div
            class="nav-icon-container flex items-center justify-center size-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 transition-all group-active:scale-95">
            <span class="material-symbols-outlined text-xl">storefront</span>
          </div>
          <p class="nav-text text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Town</p>
        </a>

        <!-- Floating action button context (Factory) -->
        <a class="flex flex-col items-center gap-1 group cursor-pointer mx-1" onclick="switchTab('factory')"
          id="nav-factory">
          <div
            class="nav-icon-container size-12 bg-primary dark:bg-primary rounded-full flex items-center justify-center -mt-6 shadow-lg shadow-primary/40 text-white border-2 border-white dark:border-slate-800 transition-all group-active:scale-95">
            <span class="material-symbols-outlined text-2xl">menu_book</span>
          </div>
          <p class="nav-text text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Recipes
          </p>
        </a>

        <a class="flex flex-1 flex-col items-center gap-1 group cursor-pointer" onclick="switchTab('upgrades')"
          id="nav-upgrades">
          <div
            class="nav-icon-container flex items-center justify-center size-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 transition-all group-active:scale-95">
            <span class="material-symbols-outlined text-xl">trending_up</span>
          </div>
          <p class="nav-text text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Upgrades
          </p>
        </a>

        <a class="flex flex-1 flex-col items-center gap-1 group cursor-pointer" onclick="switchTab('trucks')"
          id="nav-trucks">
          <div
            class="nav-icon-container flex items-center justify-center size-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 transition-all group-active:scale-95">
            <span class="material-symbols-outlined text-xl">local_shipping</span>
          </div>

          </p>
        </a>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ══════════════════════════════════════════════════════
    //  CORE STATE
    // ══════════════════════════════════════════════════════
    const DEF = {
      cash: 300, day: 1, tick: 0, season: 0,
      level: 1, levelReqs: [],
      totalRevenue: 0, totalExpenses: 0, lifetimeEggs: 0,
      prestige: 0, prestigeMult: 1,

      // Inventory - raw & processed goods
      inv: {
        egg: 0, feedWheat: 100, feedCorn: 50, water: 100,
        freeRange: 0, organic: 0, powdered: 0, mayo: 0, omelette: 0, cake: 0, custard: 0, vaccine: 0
      },
      invCap: { egg: 80, feedWheat: 200, feedCorn: 200, water: 200 },

      // Plots: id, type, level, workers[], lastHarvest, autoHarvest, stored
      plots: [
        { id: 'p1', type: 'henCoop', level: 1, workers: [], stored: 0, eggCap: 20, cooldown: 0, autoHarvest: false, unlocked: true },
        { id: 'p2', type: 'feedFarm', level: 1, workers: [], stored: 0, rate: 0.5, cooldown: 0, autoHarvest: false, unlocked: true },
        { id: 'p3', type: 'waterWell', level: 1, workers: [], stored: 0, rate: 1.0, cooldown: 0, autoHarvest: false, unlocked: false },
        { id: 'p4', type: 'cornField', level: 0, workers: [], stored: 0, eggCap: 0, cooldown: 0, autoHarvest: false, unlocked: false },
        { id: 'p5', type: 'organicFarm', level: 0, workers: [], stored: 0, eggCap: 0, cooldown: 0, autoHarvest: false, unlocked: false },
        { id: 'p6', type: 'hatchery', level: 0, workers: [], stored: 0, eggCap: 0, cooldown: 0, autoHarvest: false, unlocked: false },
      ],


      // Factory queue
      factoryQueue: [],
      factorySlots: 1,
      factoryLevel: 1,

      // Staff
      staff: [],
      maxStaff: 3,

      // Trucks
      trucks: [],
      maxTrucks: 1,

      // Contracts (expire, qty, price, deadline)
      contracts: [],
      contractsRefreshed: 0,

      // Finance ledger (last 10 entries)
      ledger: [],
      dailyRevenue: 0,
      dailyExpenses: 0,

      // Upgrades purchased
      upgrades: {},

      // Milestones
      milestones: {},

      // Weather
      weather: { type: 'sunny', daysLeft: 2 },
      marketTrend: 1.0,
      frenzyActive: 0,
    };


    let G = JSON.parse(JSON.stringify(DEF));
    try { const s = localStorage.getItem('cft2'); if (s) G = { ...JSON.parse(JSON.stringify(DEF)), ...JSON.parse(s) }; } catch (e) { }
    // Ensure arrays
    if (!G.staff) G.staff = [];
    if (!G.trucks) G.trucks = [];
    if (!G.contracts) G.contracts = [];
    if (!G.factoryQueue) G.factoryQueue = [];
    if (!G.ledger) G.ledger = [];
    if (!G.upgrades) G.upgrades = {};
    if (!G.milestones) G.milestones = {};
    if (!G.inv) G.inv = { ...DEF.inv };

    function save() { try { localStorage.setItem('cft2', JSON.stringify(G)); } catch (e) { } }
    function hardReset() { if (confirm('Delete all progress?')) { localStorage.removeItem('cft2'); location.reload(); } }

    // ══════════════════════════════════════════════════════
    //  CONSTANTS
    // ══════════════════════════════════════════════════════
    const SEASONS = ['🌸 Spring', '☀️ Summer', '🍂 Autumn', '❄️ Winter'];
    const SEASON_EFFECTS = [
      { prod: 1.2, price: 1.0, label: '+20% production' },
      { prod: 1.0, price: 1.3, label: '+30% prices' },
      { prod: 0.8, price: 1.1, label: '-20% production, +10% prices' },
      { prod: 1.5, price: 0.9, label: '+50% production, -10% prices' },
    ];
    const WEATHER_TYPES = [
      { type: 'sunny', icon: '☀️', label: 'Clear skies', prod: 1.1, price: 1.0, days: [1, 3] },
      { type: 'rain', icon: '🌧️', label: 'Heavy rain', prod: 1.3, price: 1.0, days: [1, 2] },
      { type: 'storm', icon: '⛈️', label: 'Storm warning', prod: 0.5, price: 1.2, days: [1, 2] },
      { type: 'fog', icon: '🌫️', label: 'Morning fog', prod: 0.9, price: 1.0, days: [1, 2] },
      { type: 'heatwave', icon: '🔥', label: 'Heatwave', prod: 0.7, price: 1.4, days: [1, 3] },
      { type: 'perfect', icon: '🌤️', label: 'Perfect weather', prod: 1.5, price: 1.1, days: [1, 2] },
    ];

    const PLOT_DEFS = {
      henCoop: { icon: '🐔', name: 'Hen Coop', output: 'egg', baseRate: 10.0, feedNeeds: { feedWheat: 1, water: 1 }, unlockCost: 0, maxLevel: 8 },
      feedFarm: { icon: '🌾', name: 'Feed Farm', output: 'feedWheat', baseRate: 15.0, feedNeeds: { water: 1 }, unlockCost: 80, maxLevel: 6 },
      waterWell: { icon: '💧', name: 'Water Well', output: 'water', baseRate: 20.0, feedNeeds: {}, unlockCost: 120, maxLevel: 6 },
      organicFarm: { icon: '🌿', name: 'Organic Coop', output: 'organic', baseRate: 4.0, feedNeeds: { feedCorn: 2, water: 1 }, unlockCost: 400, maxLevel: 5 },
      hatchery: { icon: '🐣', name: 'Hatchery', output: 'freeRange', baseRate: 2.0, feedNeeds: { feedWheat: 1, feedCorn: 1, water: 2 }, unlockCost: 600, maxLevel: 4 },
      cornField: { icon: '🌽', name: 'Corn Field', output: 'feedCorn', baseRate: 12.0, feedNeeds: { water: 1 }, unlockCost: 150, maxLevel: 6 },
    };


    const RECIPES = [
      { id: 'powdered', icon: '🥛', name: 'Powdered Eggs', time: 20, inputs: { egg: 8 }, output: 'powdered', qty: 3, sellPrice: 18, unlockLevel: 1 },
      { id: 'mayo', icon: '🫙', name: 'Mayonnaise Jar', time: 35, inputs: { egg: 5, water: 2 }, output: 'mayo', qty: 2, sellPrice: 28, unlockLevel: 1 },
      { id: 'omelette', icon: '🍳', name: 'Gourmet Omelette', time: 45, inputs: { egg: 6, feedWheat: 2 }, output: 'omelette', qty: 3, sellPrice: 35, unlockLevel: 2 },
      { id: 'freeRange', icon: '🥚', name: 'Free Range Pack', time: 15, inputs: { freeRange: 4 }, output: 'freeRange', qty: 4, sellPrice: 22, unlockLevel: 2 },
      { id: 'organic', icon: '🌿', name: 'Organic Box', time: 25, inputs: { organic: 4, water: 1 }, output: 'organic', qty: 4, sellPrice: 32, unlockLevel: 3 },
      { id: 'cake', icon: '🎂', name: 'Egg Cake', time: 80, inputs: { egg: 10, feedWheat: 5, water: 3 }, output: 'cake', qty: 2, sellPrice: 75, unlockLevel: 3 },
      { id: 'custard', icon: '🍮', name: 'Custard Batch', time: 60, inputs: { egg: 8, water: 4 }, output: 'custard', qty: 3, sellPrice: 55, unlockLevel: 4 },
      { id: 'vaccine', icon: '💉', name: 'Egg Protein Serum', time: 120, inputs: { organic: 3, freeRange: 2, egg: 5 }, output: 'vaccine', qty: 1, sellPrice: 200, unlockLevel: 5 },
    ];

    const STAFF_ROLES = [
      { id: 'farmer', icon: '👨‍🌾', name: 'Farmer', salary: 12, bonus: 'Harvests plots automatically', skill: 'autoHarvest', value: 1 },
      { id: 'driver', icon: '🚛', name: 'Truck Driver', salary: 18, bonus: 'Auto-dispatches full trucks', skill: 'truckBonus', value: 1 },
      { id: 'chef', icon: '👨‍🍳', name: 'Factory Chef', salary: 22, bonus: '+25% factory speed', skill: 'factorySpeed', value: 0.25 },
      { id: 'trader', icon: '📈', name: 'Market Trader', salary: 20, bonus: '+15% all sell prices', skill: 'priceBonus', value: 0.15 },
      { id: 'vet', icon: '🐾', name: 'Farm Vet', salary: 15, bonus: '+30% coop production', skill: 'coopBonus', value: 0.30 },
      { id: 'manager', icon: '🤵', name: 'Operations Mgr', salary: 35, bonus: 'All staff bonuses +20%', skill: 'megaBonus', value: 0.20 },
    ];

    const TRUCK_TYPES = [
      { id: 'van', icon: '🚐', name: 'Delivery Van', cap: 30, speed: 1.0, range: 1, cost: 300, routes: ['town'] },
      { id: 'truck', icon: '🚚', name: 'Medium Truck', cap: 80, speed: 0.9, range: 2, cost: 700, routes: ['town', 'city'] },
      { id: 'semi', icon: '🚛', name: 'Semi Truck', cap: 200, speed: 0.8, range: 3, cost: 1800, routes: ['town', 'city', 'export'] },

    const ROUTES = [

    const CONTRACT_POOL = [
      { buyer: '🍽️ Downtown Restaurant', want: 'egg', qty: 30, pricePerUnit: 3.5, urgent: false, lucrative: false },
      { buyer: '🏨 Grand Hotel Chain', want: 'omelette', qty: 8, pricePerUnit: 45, urgent: false, lucrative: true },

    const FARM_UPGRADES = [
      { id: 'eggCap', icon: '📦', name: 'Egg Storage +50', desc: 'Expand total egg capacity.', cost: 200, effect: 'invCap.egg += 50', repeatable: true, count: 0, max: 10 },
      { id: 'feedRate', icon: '🌾', name: 'Feed Efficiency', desc: '25% less feed consumed per cycle.', cost: 150, effect: 'feedEff', repeatable: true, count: 0, max: 5 },
      { id: 'coopSpeed', icon: '⚡', name: 'Coop Speed Boost', desc: 'All coops produce 20% faster.', cost: 180, effect: 'coopSpeed', repeatable: true, count: 0, max: 6 },
      { id: 'waterEff', icon: '💧', name: 'Water Recycler', desc: '50% less water used.', cost: 220, effect: 'waterEff', repeatable: false, count: 0, max: 1 },
      { id: 'factSlots', icon: '🏭', name: 'Factory Slot +1', desc: 'Process one more recipe at once.', cost: 350, effect: 'factorySlots++', repeatable: true, count: 0, max: 3 },
      { id: 'factLevel', icon: '🏗️', name: 'Factory Expansion', desc: 'Unlocks advanced recipes.', cost: 800, effect: 'factoryLevel++', repeatable: true, count: 0, max: 4 },
      { id: 'staffSlot', icon: '👷', name: 'Hire +1 Staff Slot', desc: 'Expand your team capacity.', cost: 250, effect: 'maxStaff++', repeatable: true, count: 0, max: 5 },
      { id: 'truckSlot', icon: '🚚', name: 'Fleet Slot +1', desc: 'Buy an additional truck.', cost: 500, effect: 'maxTrucks++', repeatable: true, count: 0, max: 4 },

    // ══════════════════════════════════════════════════════
    //  DERIVED STATS
    // ══════════════════════════════════════════════════════
    function getStaffBonus(skill) {
      let total = 0;
      G.staff.forEach(s => { if (s.skill === skill) total += s.value; });
      const hasMgr = G.staff.some(s => s.skill === 'megaBonus');
      if (hasMgr && total > 0) total *= 1.2;
      return total;
    }
    function getPriceMultiplier() {
      const season = SEASON_EFFECTS[G.season % 4];
      const weather = getCurrentWeather();
      const volatility = G.marketTrend || 1.0;
      const frenzy = (G.frenzyActive && G.tick % 2 === 0) ? 2.0 : 1.0;
      return season.price * weather.price * (1 + getStaffBonus('priceBonus')) * G.prestigeMult * volatility * frenzy;
    }

    function getProductionMultiplier() {
      const season = SEASON_EFFECTS[G.season % 4];
      const weather = getCurrentWeather();
      return season.prod * weather.prod;
    }
    function getCurrentWeather() {
      const wt = WEATHER_TYPES.find(w => w.type === G.weather.type) || WEATHER_TYPES[0];
      return { prod: wt.prod, price: wt.price, icon: wt.icon, label: wt.label, type: wt.type };
    }
    function getPayroll() { return G.staff.reduce((a, s) => a + s.salary, 0); }
    function getFactorySpeed() { return 1 + getStaffBonus('factorySpeed'); }
    function getCoopBonus() { return 1 + getStaffBonus('coopBonus'); }
    function getFeedEff() { return Math.max(0.3, 1 - (G.upgrades.feedRate || 0) * 0.25); }
    function getCoopSpeed() { return 1 + (G.upgrades.coopSpeed || 0) * 0.2; }

    // ══════════════════════════════════════════════════════
    //  GAME TICK (every 1s)
    // ══════════════════════════════════════════════════════
    let tickInterval = null;
    function startTick() {
      tickInterval = setInterval(gameLoop, 1000);
    }
    function gameLoop() {
      G.tick++;

      // Day cycle (every 120s = 2 min per day)
      if (G.tick % 120 === 0) advanceDay();

      // Plot auto-production
      producePlots();

      // Factory queue processing
      processFactory();

      // Auto trucks
      autoTrucks();

      // Contract expiry
      tickContracts();

      // Weather tick
      tickWeather();

      // Market Volatility (every 30s)
      if (G.tick % 30 === 0) {
        G.marketTrend = 0.8 + Math.random() * 0.4; // 80% to 120%
        if (Math.random() > 0.9) {
          G.frenzyActive = 10; // 10 seconds of frenzy
          showToast('🔥 MARKET FRENZY! Prices Doubled!');
        }
      }
      if (G.frenzyActive > 0) G.frenzyActive--;

      // Auto-staff actions
      autoStaffActions();

      // Check level progress
      if (G.tick % 2 === 0) checkLevelProgress();

      // Update UI
      updateUI();
      if (G.tick % 5 === 0) {
        if (currentZone === 'farm') renderFarm();
        else if (currentZone === 'factory') renderFactory();
      }

      // Save every 30s
      if (G.tick % 30 === 0) save();
    }

    function advanceDay() {
      G.day++;
      // Season (8 days per season)
      G.season = Math.floor((G.day - 1) / 8) % 4;
      // Daily payroll
      const payroll = getPayroll();
      if (payroll > 0) {
        if (G.cash >= payroll) {
          G.cash -= payroll;
          G.totalExpenses += payroll;
          G.dailyExpenses += payroll;
          addLedger(`Payroll (${G.staff.length} staff)`, -payroll, 'payroll');
        } else {
          showToast('⚠️ Cannot pay staff! They\'re unhappy.');
          G.staff.forEach(s => { s.morale = Math.max(0, (s.morale || 100) - 30); });
        }
      }
      // New contracts
      if (G.contracts.filter(c => !c.accepted).length < 3) generateContracts(2);
      // Reset daily stats
      G.dailyRevenue = 0;
      G.dailyExpenses = 0;
      showToast(`🌅 Day ${G.day} — ${SEASONS[G.season % 4]}`);
      checkMilestones();
      // Weather change
      if (G.weather.daysLeft <= 1) changeWeather();
      else G.weather.daysLeft--;
    }

    function producePlots() {
      const prodMult = getProductionMultiplier() * getCoopSpeed() * getCoopBonus();
      G.plots.forEach(plot => {
        if (!plot.unlocked || plot.level < 1) return;
        const def = PLOT_DEFS[plot.type];
        if (!def) return;

        // Check feed availability (with tiny buffer to prevent tick jitter)
        const feedNeeds = def.feedNeeds || {};
        const hasFeed = Object.entries(feedNeeds).every(([item, amt]) =>
          (G.inv[item] || 0) > 0.001
        );

        plot.starving = !hasFeed;
        if (!hasFeed) return;

        // Consume feed
        Object.entries(feedNeeds).forEach(([item, amt]) => {
          G.inv[item] = Math.max(0, (G.inv[item] || 0) - amt * getFeedEff() * 0.016);
        });

        const rate = def.baseRate * plot.level * prodMult * (1 / 60); // per tick

        // Instead of adding directly to global inv, add to plot's local storage
        const cap = 100 * plot.level; // Local plot storage cap
        plot.stored = Math.min(cap, (plot.stored || 0) + rate);

        // Stats
        if (def.output === 'egg') G.lifetimeEggs += rate;
      });
    }

    function processFactory() {
      if (G.factoryQueue.length === 0) return;
      const active = G.factoryQueue.slice(0, G.factorySlots);
      active.forEach(job => {
        job.progress = (job.progress || 0) + (1 / job.totalTime) * getFactorySpeed();
        if (job.progress >= 1) {
          // Done
          G.inv[job.output] = (G.inv[job.output] || 0) + job.qty;
          const value = job.qty * job.sellPrice;
          addLedger(`🏭 Produced ${job.qty}× ${job.name}`, 0, 'factory');
          G.factoryQueue = G.factoryQueue.filter(q => q !== job);
        }
      });
    }

    function autoTrucks() {
      G.trucks.forEach(truck => {
        if (!truck.active || truck.status !== 'dispatched') return;
        truck.tripProgress = (truck.tripProgress || 0) + (1 / truck.tripTime);
        if (truck.tripProgress >= 1) {
          const route = ROUTES.find(r => r.id === truck.currentRoute);
          const pricePerEgg = (route?.basePrice || 2) * getPriceMultiplier();
          const earned = Math.floor(truck.load * pricePerEgg);
          G.cash += earned;
          G.totalRevenue += earned;
          G.dailyRevenue += earned;
          addLedger(`🚚 ${truck.name} delivered ${truck.load} units → ${route?.name}`, earned, 'truck');
          truck.status = 'idle';
          truck.tripProgress = 0;
          truck.load = 0;
          showToast(`🚚 ${truck.name} returned! +$${earned}`);
        }
      });
    }

    function autoStaffActions() {
      // Farmers auto-harvest (if auto-collect upgrade or farmer staff)
      const hasFarmer = G.staff.some(s => s.skill === 'autoHarvest');
      const hasAutoCollect = G.upgrades.autoCollect;
      if ((hasFarmer || hasAutoCollect) && G.tick % 5 === 0) {
        G.plots.forEach(plot => {
          if (plot.unlocked && plot.level >= 1 && (plot.stored || 0) >= 1) {
            harvestPlot(plot.id, null, true);
          }
        });
      }

      // Drivers auto-dispatch trucks
      const hasDriver = G.staff.some(s => s.skill === 'truckBonus');
      if (hasDriver && G.tick % 10 === 0) {
        G.trucks.forEach(truck => {
          if (truck.active && truck.status === 'idle') {
            const availEggs = Math.floor(G.inv.egg || 0);
            const loadAmt = Math.min(availEggs, truck.cap);
            if (loadAmt >= truck.cap || loadAmt >= 50) { // Dispatch if full or at least 50
              const tDef = TRUCK_TYPES.find(t => t.id === truck.type);
              if (tDef) {
                // Find best route
                const routes = tDef.routes.map(rId => ROUTES.find(r => r.id === rId)).filter(Boolean);
                if (routes.length > 0) {
                  const bestRoute = routes.sort((a, b) => b.basePrice - a.basePrice)[0];
                  dispatchTruck(truck.id, bestRoute.id, true);
                }
              }
            }
          }
        });
      }
    }

    function tickContracts() {
      G.contracts.forEach(c => { if (!c.accepted) c.ticksLeft = (c.ticksLeft || 600) - 1; });
      G.contracts = G.contracts.filter(c => c.accepted || c.ticksLeft > 0);
    }

    function tickWeather() {
      // Weather changes handled in advanceDay
    }

    function changeWeather() {
      const w = WEATHER_TYPES[Math.floor(Math.random() * WEATHER_TYPES.length)];
      const daysRange = w.days;
      G.weather = { type: w.type, daysLeft: daysRange[0] + Math.floor(Math.random() * (daysRange[1] - daysRange[0] + 1)) };
    }

    // ══════════════════════════════════════════════════════
    //  PLAYER ACTIONS
    // ══════════════════════════════════════════════════════
    function harvestPlot(plotId, event, auto = false) {
      if (event) event.stopPropagation(); // prevent clicking behind
      const plot = G.plots.find(p => p.id === plotId);
      if (!plot || !plot.unlocked || plot.level < 1) return;

      const def = PLOT_DEFS[plot.type];
      let stored = Math.floor(plot.stored || 0);

      const cap = G.invCap[def.output] || 999;
      const currentInv = G.inv[def.output] || 0;
      const spaceLeft = cap - currentInv;

      if (spaceLeft <= 0) {
        if (!auto) showToast(`Inventory full for ${def.output}!`);
        return;
      }

      let tapBonus = 0;
      if (!auto) {
        tapBonus = Math.max(1, Math.floor(def.baseRate * plot.level * 0.2));
      }

      let totalAvailable = stored + tapBonus;
      if (totalAvailable < 1 && auto) return;

      let toHarvest = Math.floor(totalAvailable);
      if (toHarvest > spaceLeft) toHarvest = spaceLeft;

      if (toHarvest > 0) {
        const takeFromStorage = Math.max(0, toHarvest - tapBonus);
        plot.stored = Math.max(0, plot.stored - takeFromStorage);
        G.inv[def.output] = currentInv + toHarvest;

        if (!auto && event) spawnFloat(`+${toHarvest} ${def.icon}`, event);
      }
    }

    function unlockPlot(plotId) {
      const plot = G.plots.find(p => p.id === plotId);
      if (!plot || plot.unlocked) return;
      const def = PLOT_DEFS[plot.type];
      if (!def) return;
      if (G.cash < def.unlockCost) { showToast(`Need $${def.unlockCost} to unlock!`); return; }
      G.cash -= def.unlockCost;
      plot.unlocked = true;
      plot.level = 1;
      G.totalExpenses += def.unlockCost;
      addLedger(`Unlocked ${def.name}`, -def.unlockCost, 'unlock');
      showToast(`🎉 ${def.name} unlocked!`);
      save(); renderFarm();
    }

    function upgradePlot(plotId) {
      const plot = G.plots.find(p => p.id === plotId);
      if (!plot) return;
      const def = PLOT_DEFS[plot.type];
      const cost = Math.floor(80 * Math.pow(1.8, plot.level));
      if (G.cash < cost) { showToast(`Need $${cost} to upgrade!`); return; }
      if (plot.level >= def.maxLevel) { showToast('Already at max level!'); return; }
      G.cash -= cost;
      plot.level++;
      G.totalExpenses += cost;
      addLedger(`Upgraded ${def.name} to Lv${plot.level}`, -cost, 'upgrade');
      spawnFloat(`⬆️ Lv${plot.level}`, null, window.innerWidth / 2, window.innerHeight / 2);
      showToast(`${def.name} upgraded to Level ${plot.level}!`);
      save(); updateUI(); renderFarm();
    }


    function queueRecipe(recipeId) {
      const recipe = RECIPES.find(r => r.id === recipeId);
      if (!recipe) return;
      if (G.factoryQueue.length >= G.factorySlots * 2) { showToast('Factory queue full!'); return; }
      // Check inputs
      for (const [item, amt] of Object.entries(recipe.inputs)) {
        if ((G.inv[item] || 0) < amt) { showToast(`Need ${amt} ${item} (Tap plots to harvest!)`); return; }
      }
      // Consume inputs
      for (const [item, amt] of Object.entries(recipe.inputs)) G.inv[item] -= amt;
      G.factoryQueue.push({
        ...recipe, progress: 0,
        totalTime: recipe.time,
        startedAt: Date.now(),
        id: 'q_' + Date.now()
      });
      showToast(`🏭 Started: ${recipe.name}`);
      save(); renderFactory();
    }

    function sellSpot(goodId, qty) {
      const avail = Math.floor(G.inv[goodId] || 0);
      if (avail < qty) { showToast('Not enough stock!'); return; }
      const priceMap = {
        egg: 2.2, freeRange: 5.5, organic: 7.8, powdered: 6.0, mayo: 14, omelette: 11.5,
        cake: 37, custard: 18, vaccine: 200, feedWheat: 0.8, water: 0.3
      };
      const basePrice = priceMap[goodId] || 1;
      const earn = Math.floor(qty * basePrice * getPriceMultiplier());
      G.inv[goodId] -= qty;
      G.cash += earn;
      G.totalRevenue += earn;
      G.dailyRevenue += earn;
      addLedger(`Sold ${qty}× ${goodId}`, earn, 'sell');
      spawnFloat(`+$${earn}`, null, window.innerWidth - 80, window.innerHeight * 0.4);
      showToast(`Sold ${qty} ${goodId} for $${earn}`);
      save(); updateUI(); renderMarket();
    }

    function acceptContract(contractId) {
      const c = G.contracts.find(x => x.id === contractId);
      if (!c || c.accepted) return;
      const avail = Math.floor(G.inv[c.want] || 0);
      if (avail < c.qty) { showToast(`Need ${c.qty} ${c.want}, you have ${avail}`); return; }
      G.inv[c.want] -= c.qty;
      const earn = Math.floor(c.qty * c.pricePerUnit * getPriceMultiplier());
      G.cash += earn;
      G.totalRevenue += earn;
      G.dailyRevenue += earn;
      c.accepted = true;
      addLedger(`Contract: ${c.buyer.split(' ').slice(1).join(' ')}`, earn, 'contract');
      spawnFloat(`+$${earn} 📋`, null, window.innerWidth / 2, window.innerHeight * 0.4);
      showToast(`✅ Contract fulfilled! +$${earn}`);
      checkMilestones();
      save(); renderMarket();
    }

    function dispatchTruck(truckId, routeId, auto = false) {
      const truck = G.trucks.find(t => t.id === truckId);
      const route = ROUTES.find(r => r.id === routeId);
      if (!truck || !route) return;
      if (truck.status !== 'idle') { if (!auto) showToast('Truck already on the road!'); return; }
      // Check if route allowed for truck type
      const truckDef = TRUCK_TYPES.find(t => t.id === truck.type);
      if (!truckDef.routes.includes(routeId)) { if (!auto) showToast(`This truck can't access ${route.name}`); return; }
      // Load eggs
      const loadAmt = Math.min(Math.floor(G.inv.egg || 0), truck.cap);
      if (loadAmt < 5) { if (!auto) showToast('Need at least 5 eggs to dispatch!'); return; }
      G.inv.egg -= loadAmt;
      truck.status = 'dispatched';
      truck.currentRoute = routeId;
      truck.load = loadAmt;
      truck.tripProgress = 0;
      truck.tripTime = Math.floor(60 * route.dist / (truckDef.speed || 1)); // ticks
      if (!auto) showToast(`🚚 ${truck.name} dispatched to ${route.name} with ${loadAmt} eggs!`);
      save(); renderTrucks();
    }

    function hireStaff(roleId) {
      const role = STAFF_ROLES.find(r => r.id === roleId);
      if (!role) return;
      if (G.staff.length >= G.maxStaff) { showToast(`Need more staff slots! Buy upgrade.`); return; }
      if (G.staff.some(s => s.id === roleId)) { showToast('Already hired this role!'); return; }
      const hireCost = role.salary * 7; // 7 days upfront
      if (G.cash < hireCost) { showToast(`Hiring costs $${hireCost} (7 days salary)`); return; }
      G.cash -= hireCost;
      G.totalExpenses += hireCost;
      G.staff.push({ ...role, morale: 100, hiredDay: G.day });
      addLedger(`Hired ${role.name}`, -hireCost, 'hire');
      showToast(`👷 ${role.name} hired!`);
      closeModal(); save(); renderStaff();
    }

    function fireStaff(roleId) {
      if (!confirm(`Fire this employee? They won't be happy.`)) return;
      G.staff = G.staff.filter(s => s.id !== roleId);
      showToast('Employee let go.');
      save(); renderStaff();
    }

    function buyTruck(typeId) {
      const tDef = TRUCK_TYPES.find(t => t.id === typeId);
      if (!tDef) return;
      if (G.trucks.length >= G.maxTrucks) { showToast('Need more fleet slots!'); return; }
      if (G.trucks.some(t => t.type === typeId)) { showToast('You already own this truck type. Buy a fleet slot to add another.'); return; }
      if (G.cash < tDef.cost) { showToast(`Need $${tDef.cost}!`); return; }
      G.cash -= tDef.cost;
      G.totalExpenses += tDef.cost;
      G.trucks.push({
        id: 't_' + Date.now(), type: typeId, name: tDef.name,
        cap: tDef.cap, status: 'idle', tripProgress: 0, load: 0, currentRoute: null, active: true
      });
      addLedger(`Bought ${tDef.name}`, -tDef.cost, 'purchase');
      showToast(`🚚 ${tDef.name} added to fleet!`);
      closeModal(); save(); renderTrucks();
    }

    function buyFarmUpgrade(upgradeId) {
      const upg = FARM_UPGRADES.find(u => u.id === upgradeId);
      if (!upg) return;
      const count = G.upgrades[upgradeId] || 0;
      if (count >= upg.max) { showToast('Already maxed!'); return; }
      const cost = Math.floor(upg.cost * Math.pow(1.6, count));
      if (G.cash < cost) { showToast(`Need $${cost}!`); return; }
      G.cash -= cost;
      G.totalExpenses += cost;
      G.upgrades[upgradeId] = count + 1;
      addLedger(`Upgrade: ${upg.name}`, -cost, 'upgrade');
      // Apply effect
      if (upgradeId === 'eggCap') G.invCap.egg = (G.invCap.egg || 80) + 50;
      if (upgradeId === 'factSlots') G.factorySlots = Math.min(4, (G.factorySlots || 1) + 1);
      if (upgradeId === 'factLevel') G.factoryLevel = (G.factoryLevel || 1) + 1;
      if (upgradeId === 'staffSlot') G.maxStaff = (G.maxStaff || 3) + 1;
      if (upgradeId === 'truckSlot') G.maxTrucks = (G.maxTrucks || 1) + 1;
      if (upgradeId === 'autoCollect') G.upgrades.autoCollect = true;
      showToast(`✨ ${upg.name} upgraded!`);
      save(); updateUI(); renderFarmUpgrades();
    }


    // ══════════════════════════════════════════════════════
    //  CONTRACTS
    // ══════════════════════════════════════════════════════
    function generateContracts(count) {
      const pool = [...CONTRACT_POOL].sort(() => Math.random() - .5);
      for (let i = 0; i < count && i < pool.length; i++) {
        const base = pool[i];
        G.contracts.push({
          ...base, id: 'c_' + Date.now() + i,
          accepted: false, ticksLeft: 600,
          qty: Math.floor(base.qty * (0.7 + Math.random() * 0.6)),
        });
      }
    }

    function refreshContracts() {
      const cost = 50;
      if (G.cash < cost) { showToast(`Refresh costs $${cost}`); return; }
      G.cash -= cost;
      G.contracts = G.contracts.filter(c => c.accepted);
      generateContracts(4);
      showToast('Contracts refreshed!');
      save(); renderMarket();
    }

    // ══════════════════════════════════════════════════════
    //  FINANCE HELPERS
    // ══════════════════════════════════════════════════════
    function addLedger(desc, amount, type) {
      G.ledger.unshift({ desc, amount, type, day: G.day, ts: Date.now() });
      if (G.ledger.length > 30) G.ledger.pop();
    }

    function checkMilestones() {
      const checks = [
        { id: 'first_sale', label: 'First Sale', desc: 'Sell your first eggs', check: () => G.totalRevenue > 0 },

                  </div>
                  <span class="text-sm font-black ${e.amount > 0 ? 'text-green-500' : e.amount < 0 ? 'text-red-500' : 'text-slate-500'}">
                      ${e.amount > 0 ? '+' : ''}${e.amount !== 0 ? '$' + Math.abs(e.amount).toLocaleString() : '—'}
                  </span>
              </div>
              `).join('')}
          </div>
      </div>
        `;

      html += `</div>`;

      const fc = document.getElementById('financeRenderContainer');
      if (fc) fc.innerHTML = html;
    }

    // ══════════════════════════════════════════════════════
    //  MODALS
    // ══════════════════════════════════════════════════════
    function openModal(title, html) {
      closeModal();
      const bg = document.createElement('div');
      bg.className = 'fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 modal-bg transition-opacity duration-300 opacity-0';
      bg.id = 'modalBg';
      bg.innerHTML = `
        <div class="bg-slate-50 dark:bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col max-h-[90vh] scale-90 transition-transform duration-300">
          <!-- Modal Header -->
          <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-white dark:bg-slate-800">
              <h2 class="text-lg text-slate-800 dark:text-white font-black tracking-tight">${title}</h2>
              <button class="size-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors" onclick="closeModal()">
                  <span class="material-symbols-outlined text-sm">close</span>
              </button>
          </div>
          <!-- Modal Body -->
          <div class="overflow-y-auto overflow-x-hidden relative flex-1">
            ${html}
          </div>
        </div>
        `;
      bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
      document.body.appendChild(bg);

      // Animate in
      setTimeout(() => {
        bg.classList.remove('opacity-0');
        bg.querySelector('.max-w-md').classList.remove('scale-90');
      }, 10);
    }
    function closeModal() {
      const m = document.getElementById('modalBg');
      if (m) {
        m.classList.add('opacity-0');
        m.querySelector('.max-w-md').classList.add('scale-90');
        setTimeout(() => m.remove(), 300);
      }
    }

    function openHireModal() {
      const html = `<div class="p-4 flex flex-col gap-3">` +
        STAFF_ROLES.map(r => {
          const hired = G.staff.some(s => s.id === r.id);
          const hireCost = r.salary * 7;
          const canAfford = G.cash >= hireCost;
          const full = G.staff.length >= G.maxStaff;
          return `
        <div class="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col gap-3">
            <div class="items-start flex gap-4">
                <div class="size-12 bg-white dark:bg-slate-700 rounded-xl flex items-center justify-center text-3xl shadow-sm flex-shrink-0">
                    ${r.icon}
                </div>
                <div class="flex-1 overflow-hidden">
                    <h4 class="text-sm font-bold text-slate-800 dark:text-white capitalize leading-tight mb-1 truncate">${r.name}</h4>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 text-primary">${r.bonus}</p>
                    <p class="text-[9px] text-slate-400 capitalize truncate">Salary: $${r.salary}/day</p>
                </div>
            </div>
            <button class="w-full py-1.5 ${hired ? 'bg-slate-200 dark:bg-slate-700 text-slate-400' : canAfford && !full ? 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 active:scale-95 shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'} rounded-lg text-xs font-bold transition-transform" 
              ${hired || !canAfford || full ? 'disabled' : ''} onclick="hireStaff('${r.id}'); closeModal();">
              ${hired ? 'Already Hired' : full ? 'No Empty Desks' : 'Hire for $' + hireCost + ' (1wk pay)'}
            </button>
        </div>
        `;
        }).join('') + `</div>`;
      openModal('👷 Hire Staff', `<div style="padding:4px 0 0;font-size:.78em;color:#64748b;text-align:center;padding:8px 14px 4px;">Staff Slots: ${G.staff.length}/${G.maxStaff} Used</div>${html}`);
    }

    function openBuyTruckModal() {
      const html = `<div class="p-4 flex flex-col gap-3">` +
        TRUCK_TYPES.map(t => {
          const owned = G.trucks.some(x => x.type === t.id);
          const canAfford = G.cash >= t.cost;
          const full = G.trucks.length >= G.maxTrucks;
          return `
        <div class="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 shadow-sm flex items-start gap-4">
            <div class="size-12 bg-white dark:bg-slate-700 rounded-xl flex items-center justify-center text-3xl shadow-sm flex-shrink-0">
                ${t.icon}
            </div>
            <div class="flex-1">
                <h4 class="text-sm font-bold text-slate-800 dark:text-white capitalize leading-tight mb-1">${t.name}</h4>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1">Cap: ${t.cap} units</p>
                <p class="text-[9px] text-slate-400 capitalize mb-3 line-clamp-1">Routes: ${t.routes.map(r => ROUTES.find(x => x.id === r)?.name || r).join(', ')}</p>
                
                <button class="w-full py-1.5 ${owned ? 'bg-slate-200 dark:bg-slate-700 text-slate-400' : canAfford && !full ? 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 active:scale-95 shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'} rounded-lg text-xs font-bold transition-transform" 
                  ${owned || !canAfford || full ? 'disabled' : ''} onclick="buyTruck('${t.id}'); closeModal();">
                  ${owned ? 'Already Owned' : full ? 'Fleet is Full' : 'Buy for $' + t.cost.toLocaleString()}
                </button>
            </div>
        </div>
        `;
        }).join('') + `</div>`;
      openModal('🚚 Expand Fleet', `<div style="padding:4px 0 0;font-size:.78em;color:#64748b;text-align:center;padding:8px 14px 4px;">Fleet Space: ${G.trucks.length}/${G.maxTrucks} Used</div>${html}`);
    }

    // ══════════════════════════════════════════════════════
    //  TAB SWITCHING
    // ══════════════════════════════════════════════════════
    function switchTab(tab) {
      document.querySelectorAll('.zone-container').forEach(z => z.classList.remove('active'));
      const activeZone = document.getElementById('zone-' + tab) || document.getElementById('zone-upgrades');
      activeZone.classList.add('active');

      // Update Nav highlighting
      const navIds = ['farm', 'market', 'factory', 'upgrades', 'trucks'];
      navIds.forEach(id => {
        const el = document.getElementById('nav-' + id);
        if (!el) return;
        const iconContainer = el.querySelector('.nav-icon-container');
        const textEl = el.querySelector('.nav-text');
        if (id === tab) {
          if (id === 'factory') {
            // Keep special factory styling
          } else {
            iconContainer.className = 'nav-icon-container flex items-center justify-center size-10 rounded-xl bg-primary text-white transition-all group-active:scale-95';
            textEl.className = 'nav-text text-[10px] font-extrabold text-primary uppercase tracking-wider';
          }
        } else {
          if (id === 'factory') {
            // Revert special factory styling if needed (or leave as is, template keeps it primary)
          } else {
            iconContainer.className = 'nav-icon-container flex items-center justify-center size-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 transition-all group-active:scale-95';
            textEl.className = 'nav-text text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider';
          }
        }
      });

      // Render on switch
      if (tab === 'farm') renderFarm();
      if (tab === 'factory') renderFactory();
      if (tab === 'market') renderMarket();
      if (tab === 'upgrades' || tab === 'staff') { switchUpgradeTab(tab); }
      if (tab === 'trucks') renderTrucks();
      if (tab === 'finance') renderFinance();
    }

    function switchUpgradeTab(subTab) {
      document.getElementById('zone-upgrades').classList.add('active');
      document.getElementById('btn-tab-upgrades').className = subTab === 'upgrades' ? 'flex-1 py-3 text-sm font-bold border-b-4 border-primary text-primary' : 'flex-1 py-3 text-sm font-bold border-b-4 border-transparent text-slate-500 dark:text-slate-400';
      document.getElementById('btn-tab-staff').className = subTab === 'staff' ? 'flex-1 py-3 text-sm font-bold border-b-4 border-primary text-primary' : 'flex-1 py-3 text-sm font-bold border-b-4 border-transparent text-slate-500 dark:text-slate-400';

      if (subTab === 'upgrades') renderFarmUpgrades();
      if (subTab === 'staff') renderStaff();
    }



    // ══════════════════════════════════════════════════════
    //  FLOATERS & TOAST
    // ══════════════════════════════════════════════════════
    function spawnFloat(text, e, x, y) {
      const el = document.createElement('div');
      el.className = 'fixed z-[150] text-amber-400 font-black text-sm drop-shadow-md pointer-events-none animate-[floatUp_1s_ease-out_forwards] whitespace-nowrap';
      const px = e ? e.clientX || x || window.innerWidth / 2 : (x || window.innerWidth / 2);
      const py = e ? e.clientY || y || window.innerHeight / 2 : (y || window.innerHeight / 2);
      el.textContent = text;
      el.style.left = `${px - 30}px`;
      el.style.top = `${py - 20}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    // Add missing keyframes for floatUp
    const styleEl = document.createElement('style');
    styleEl.innerHTML = `@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1.2); } 100% { opacity: 0; transform: translateY(-40px) scale(1); } }`;
    document.head.appendChild(styleEl);

    let toastT = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      // Replace old CSS classes with Tailwind equivalents if elements weren't already Tailwind-styled.
      // (The HTML shell provides #toast with Tailwind `transition - all duration - 300`, so we just toggle opacity & translateY logic)

      // Because the original shell didn't include the precise classes for the toast toggle, let's manually style it here or override the classes.
      el.className = 'fixed left-1/2 -translate-x-1/2 z-[200] bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm tracking-wide transition-all duration-300 pointer-events-none top-24 opacity-100 transform translate-y-0';

      clearTimeout(toastT);
      toastT = setTimeout(() => {
        el.className = 'fixed left-1/2 -translate-x-1/2 z-[200] bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm tracking-wide transition-all duration-300 pointer-events-none top-20 opacity-0 transform -translate-y-4';
      }, 2800);
    }

    // ══════════════════════════════════════════════════════
    //  LEVELING SYSTEM
    // ══════════════════════════════════════════════════════
    function generateLevelGoals() {
      if (!G.level) G.level = 1;
      const lvl = G.level;

      // Scale requirements exponentially
      const reqs = [];
      if (lvl === 1) {
        reqs.push({ type: 'revenue', amount: 2000, desc: 'Earn $2,000 Total Revenue' });
      } else if (lvl === 2) {
        reqs.push({ type: 'cash', amount: 3000, desc: 'Save $3,000 Cash on hand' });
      } else {
        const typeRoll = Math.random();
        if (typeRoll < 0.33) {
          const targetRev = Math.floor(2000 * Math.pow(1.6, lvl - 1));
          reqs.push({ type: 'revenue', amount: targetRev, desc: `Earn $${targetRev.toLocaleString()} Total Revenue` });
        } else if (typeRoll < 0.66) {
          const targetCash = Math.floor(1500 * Math.pow(1.6, lvl - 1));
          reqs.push({ type: 'cash', amount: targetCash, desc: `Save $${targetCash.toLocaleString()} Cash on hand` });
        } else {
          // Item hoarding
          const advancedItems = ['powdered', 'mayo', 'omelette', 'cake', 'vaccine'];
          const targetItem = advancedItems[Math.floor(Math.random() * Math.min(lvl - 2, advancedItems.length))];
          const targetQty = Math.floor(5 * Math.pow(1.4, lvl - 2));
          reqs.push({ type: 'item', target: targetItem, amount: targetQty, desc: `Hoard ${targetQty} ${targetItem} s in Inventory` });
        }
      }
      G.levelReqs = reqs;
    }

    function checkLevelProgress() {
      if (!G.levelReqs || G.levelReqs.length === 0) generateLevelGoals();

      let allMet = true;
      G.levelReqs.forEach(req => {
        let val = 0;
        if (req.type === 'revenue') val = G.totalRevenue;
        if (req.type === 'cash') val = G.cash;
        if (req.type === 'item') val = G.inv[req.target] || 0;
        if (val < req.amount) allMet = false;
      });

      if (allMet && document.querySelectorAll('.modal-bg').length === 0) {
        showLevelCompleteModal();
      }
    }

    function showLevelCompleteModal() {
      const pGain = 0.5; // +50% multiplier per level
      const newMult = (G.prestigeMult + pGain).toFixed(1);
      openModal(`🎉 Level ${G.level} Complete!`, `
        <div class="p-6 text-center text-slate-800 dark:text-slate-200 flex flex-col items-center">
            <div class="text-6xl mb-4 drop-shadow-md">🌟</div>
            <h3 class="text-xl font-black mb-2 text-primary">Egg-ceptional Tycoon!</h3>
            <p class="text-sm font-bold text-slate-500 mb-6 max-w-sm">
                Moving to the next level will <span class="text-red-500">reset your cash, inventory, and plot levels</span> to start fresh.<br><br>
                However, you will <span class="text-green-500 font-black">KEEP</span> all Unlocked Plots, Farm Upgrades, Trucks, and Staff!
            </p>
            
            <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-2xl p-5 mb-6 w-full max-w-sm">
                <p class="text-[10px] font-black text-amber-600 dark:text-amber-500 uppercase tracking-wider mb-2">Permanent Prestige Multiplier</p>
                <div class="text-3xl font-black text-amber-500 flex items-center justify-center gap-3">
                    <span class="opacity-50">${G.prestigeMult.toFixed(1)}x</span>
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
                    <span>${newMult}x</span>
                </div>
                <p class="text-[10px] font-bold text-amber-700/60 dark:text-amber-400/60 uppercase tracking-wider mt-2">Applies to all sale prices permanently!</p>
            </div>
            
            <button class="w-full max-w-sm py-3 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white rounded-xl font-black text-sm shadow-lg shadow-orange-500/30 active:scale-95 transition-all flex items-center justify-center gap-2" onclick="advanceLevel(); closeModal();">
                Advance to Level ${G.level + 1} <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </div>
      `);
    }

    function advanceLevel() {
      G.level++;
      G.prestigeMult += 0.5;

      // Wipe the board
      G.cash = 300;
      G.totalRevenue = 0;
      G.totalExpenses = 0;

      // Clear inventory
      Object.keys(G.inv).forEach(k => G.inv[k] = 0);
      G.inv.feedWheat = 100;
      G.inv.feedCorn = 50;
      G.inv.water = 100;

      // Reset plots but keep them unlocked
      G.plots.forEach(plot => {
        plot.stored = 0;
        if (plot.unlocked) plot.level = 1;
      });

      // Clear queues and contracts
      G.factoryQueue = [];
      G.contracts = [];
      generateContracts(3);

      generateLevelGoals();

      closeModal();
      showToast(`🌟 Welcome to Level ${G.level}! Multiplier is now ${G.prestigeMult.toFixed(1)}x!`);
      save();
      updateUI();
      renderFarm();
    }

    // ══════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════
    // Generate initial contracts if none
    if (G.contracts.length === 0) generateContracts(3);
    if (!G.levelReqs || G.levelReqs.length === 0) generateLevelGoals();

    // Initial render
    renderFarm();
    updateUI();

    // Start game loop
    startTick();

    // Periodic UI refresh
    setInterval(() => {
      updateUI();
      // Update visible zone
      if (document.getElementById('zone-factory').classList.contains('active')) renderFactory();
      if (document.getElementById('zone-trucks').classList.contains('active')) renderTrucks();
      if (document.getElementById('zone-market').classList.contains('active')) renderMarket();
      if (document.getElementById('zone-finance').classList.contains('active')) renderFinance();
    }, 2000);

    // Welcome Tutorial
    if (!G.milestones.first_sale && G.lifetimeEggs === 0) {
      setTimeout(() => {
        openModal('🐔 Welcome to Clucky Farm!', `
          <div style="padding:15px; font-size:0.9em; line-height:1.6; color:var(--text2);">
            <p style="margin-bottom:10px;">Welcome to the farm, Tycoon! Let's get started:</p>
            <ol style="margin-left:20px; margin-bottom:15px;">
              <li><strong style="color:var(--gold);">Tap your active plots</strong> (Hen Coop, Feed Farm) to harvest goods as they produce them.</li>
              <li>Your chickens <strong style="color:var(--text);">need Water and Feed</strong> to produce eggs. Make sure your Feed Farm is producing!</li>
              <li>Go to the <strong style="color:var(--text);">Market tab</strong> to sell your raw eggs for cash.</li>
              <li>Use your cash to <strong style="color:var(--green);">upgrade plots</strong> or unlock new ones!</li>
            </ol>
            <button class="btn btn-gold btn-full" onclick="closeModal()">Let's Farm!</button>
          </div>
        `);
      }, 500);
    }
    setTimeout(() => showToast('📋 New contracts available in the Market tab!'), 16000);
  </script>
</body>

</html>
