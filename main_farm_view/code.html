<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Egg Tycoon - Main Farm</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 overflow-hidden">
<div class="relative flex h-screen w-full flex-col max-w-md mx-auto overflow-hidden shadow-2xl">
<!-- Top UI Bar -->
<div class="absolute top-0 left-0 right-0 z-20 flex flex-col gap-2 p-4 bg-gradient-to-b from-black/40 to-transparent">
<div class="flex items-center justify-between gap-2">
<!-- Eggs Counter -->
<div class="flex items-center gap-2 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-full px-3 py-1.5 border-2 border-primary shadow-sm">
<span class="material-symbols-outlined text-primary text-xl">egg</span>
<div class="flex flex-col -space-y-1">
<span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-tighter">Eggs</span>
<span class="text-sm font-extrabold text-slate-900 dark:text-white">12.5k</span>
</div>
<span class="ml-1 text-[10px] font-bold text-green-600">+200/s</span>
</div>
<!-- Cash Counter -->
<div class="flex items-center gap-2 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-full px-3 py-1.5 border-2 border-green-500 shadow-sm">
<span class="material-symbols-outlined text-green-600 text-xl">payments</span>
<div class="flex flex-col -space-y-1">
<span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-tighter">Cash</span>
<span class="text-sm font-extrabold text-slate-900 dark:text-white">$450,200</span>
</div>
</div>
<!-- Settings Button -->
<button class="flex items-center justify-center size-10 rounded-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300">settings</span>
</button>
</div>
<!-- Level Progress Bar -->
<div class="flex flex-col gap-1 px-1">
<div class="flex justify-between items-end">
<span class="text-xs font-black text-white drop-shadow-md">LVL 15</span>
<span class="text-[10px] font-bold text-white drop-shadow-md">850/1000 XP</span>
</div>
<div class="h-3 w-full bg-slate-200/30 backdrop-blur-sm rounded-full overflow-hidden border border-white/20">
<div class="h-full bg-primary rounded-full shadow-[0_0_8px_rgba(236,91,19,0.6)]" style="width: 85%;"></div>
</div>
</div>
</div>
<!-- Main Farm View (Isometric Simulation Area) -->
<div class="relative flex-1 bg-green-100 dark:bg-green-900/20 overflow-hidden">
<!-- Background Farm Texture -->
<div class="absolute inset-0 opacity-40" data-alt="Light green grass pattern with dots" style="background-image: radial-gradient(circle at 2px 2px, #2d5a27 1px, transparent 0); background-size: 40px 40px;"></div>
<!-- Isometric Farm Layout Elements -->
<div class="absolute inset-0 flex items-center justify-center scale-110 rotate-12">
<!-- Central Barn -->
<div class="absolute top-1/4 left-1/3 w-32 h-32 bg-red-600 rounded-xl border-4 border-red-800 shadow-2xl flex items-center justify-center -rotate-12" style="transform: skewX(-15deg);">
<div class="w-16 h-20 bg-red-900/50 rounded-t-lg mt-8 border-t-4 border-white/20"></div>
<span class="absolute top-2 text-white/50 material-symbols-outlined text-4xl">store</span>
</div>
<!-- Coop 1 -->
<div class="absolute top-1/2 left-1/4 w-20 h-20 bg-amber-100 rounded-lg border-2 border-amber-300 shadow-lg -rotate-12 flex flex-col items-center justify-center" style="transform: skewX(-15deg);">
<div class="grid grid-cols-2 gap-1 p-2">
<div class="size-3 bg-white rounded-full border border-slate-200 shadow-sm"></div>
<div class="size-3 bg-white rounded-full border border-slate-200 shadow-sm"></div>
</div>
<span class="text-[10px] font-bold text-amber-700">COOP 01</span>
</div>
<!-- Coop 2 -->
<div class="absolute top-1/2 left-2/3 w-20 h-20 bg-amber-100 rounded-lg border-2 border-amber-300 shadow-lg -rotate-12 flex flex-col items-center justify-center" style="transform: skewX(-15deg);">
<div class="grid grid-cols-2 gap-1 p-2">
<div class="size-3 bg-white rounded-full border border-slate-200 shadow-sm"></div>
<div class="size-3 bg-white rounded-full border border-slate-200 shadow-sm"></div>
<div class="size-3 bg-white rounded-full border border-slate-200 shadow-sm"></div>
</div>
<span class="text-[10px] font-bold text-amber-700">COOP 02</span>
</div>
<!-- Loading Dock & Truck -->
<div class="absolute bottom-1/4 right-1/4 w-40 h-24 bg-slate-300 dark:bg-slate-700 rounded-lg border-b-8 border-slate-400 dark:border-slate-800 shadow-xl -rotate-12" style="transform: skewX(-15deg);">
<div class="absolute -right-8 top-4 w-24 h-12 bg-primary rounded shadow-lg border-2 border-primary/50 flex items-center px-2">
<div class="w-8 h-8 bg-slate-800 rounded-sm"></div>
<div class="ml-auto w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xs">local_shipping</span>
</div>
</div>
<div class="p-2">
<div class="w-full h-2 bg-slate-400 dark:bg-slate-600 rounded-full mb-1"></div>
<div class="w-2/3 h-2 bg-slate-400 dark:bg-slate-600 rounded-full"></div>
</div>
</div>
<!-- Farmhand (Simplified) -->
<div class="absolute top-1/2 left-1/2 size-6 bg-blue-500 rounded-full border-2 border-white shadow-md flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-white">person</span>
</div>
</div>
<!-- Active Buffs / Notifications Overlay -->
<div class="absolute right-4 bottom-24 flex flex-col gap-2">
<div class="flex items-center gap-2 bg-white/90 dark:bg-slate-800/90 p-2 rounded-xl shadow-lg border border-primary/30">
<div class="size-8 rounded-lg bg-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl">speed</span>
</div>
<div class="flex flex-col">
<span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">BOOST</span>
<span class="text-xs font-black text-primary uppercase">2x Speed</span>
</div>
</div>
</div>
</div>
<!-- Quick Action Floating Button -->
<button class="absolute bottom-28 left-1/2 -translate-x-1/2 z-30 size-16 bg-primary rounded-full shadow-[0_8px_20px_rgba(236,91,19,0.4)] border-4 border-white dark:border-slate-800 flex items-center justify-center text-white">
<span class="material-symbols-outlined text-4xl">touch_app</span>
</button>
<!-- Bottom Navigation Menu -->
<div class="relative z-40 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-4 pb-6 pt-3 shadow-[0_-4px_20px_rgba(0,0,0,0.1)]">
<div class="flex items-center justify-between">
<!-- Farm (Active) -->
<a class="flex flex-1 flex-col items-center gap-1 group" href="#">
<div class="relative flex items-center justify-center size-12 rounded-2xl bg-primary text-white transition-all group-active:scale-95">
<span class="material-symbols-outlined text-2xl fill-1">house</span>
</div>
<p class="text-[11px] font-extrabold text-primary uppercase tracking-wider">Farm</p>
</a>
<!-- Town -->
<a class="flex flex-1 flex-col items-center gap-1 group" href="#">
<div class="flex items-center justify-center size-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 transition-all group-active:scale-95">
<span class="material-symbols-outlined text-2xl">map</span>
</div>
<p class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Town</p>
</a>
<!-- Spacer for floating button -->
<div class="flex-1"></div>
<!-- Shop -->
<a class="flex flex-1 flex-col items-center gap-1 group" href="#">
<div class="flex items-center justify-center size-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 transition-all group-active:scale-95">
<span class="material-symbols-outlined text-2xl">storefront</span>
</div>
<p class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Shop</p>
</a>
<!-- Trucks -->
<a class="flex flex-1 flex-col items-center gap-1 group" href="#">
<div class="flex items-center justify-center size-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 transition-all group-active:scale-95">
<span class="material-symbols-outlined text-2xl">local_shipping</span>
</div>
<p class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Trucks</p>
</a>
</div>
</div>
</div>
</body></html>
